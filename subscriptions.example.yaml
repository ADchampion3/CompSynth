# Copy this file to subscriptions.yaml and edit the sources.

sources:
  - type: rss
    url: https://example.com/feed.xml
    name: Example Blog

  - type: web
    url: https://tech.example.com/
    name: Example Tech
    selectors:
      - item_container: ".post-container"
        url: ".post-title a"
        title: ".post-title"
        summary: ".post-excerpt"
        content: ".post-content"

  - type: web
    url: https://example.com/
    name: Example Multi-Selector
    selectors:
      - item_container: "div.article-section-1"
        url: "a.title"
        title: "h2"
        summary: "p"
      - item_container: "div.article-section-2"
        url: "a"
        title: "h3"
        summary: ".summary"

  - type: javascript
    url: https://app.example.com/
    name: Example JavaScript Site
    javascript: true
