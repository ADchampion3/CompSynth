# CompSynth 订阅源配置
# 复制此文件为 subscriptions.yaml 并填入实际订阅源

sources:
  - type: rss
    url: https://example.com/feed.xml
    name: Example Blog
  - type: web
    url: https://tech.example.com/
    name: Example Tech
    selectors:  # 可选：用户自定义 CSS selectors
      item_container: ".post-container"
      url: ".post-title a"
      title: ".post-title"
      summary: ".post-excerpt"
