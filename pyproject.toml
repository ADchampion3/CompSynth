[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pre-commit>=4.5.1",
  "pytest>=9.0.2"
]

[project]
name = "compsynth"
version = "0.1.0"
description = "内容聚合与发布系统 - 自动订阅、整合分析、媒体推送"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "loguru>=0.7.3",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "readability-lxml>=0.8",
  "feedparser>=6.0",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langchain-anthropic>=0.3",
  "pyyaml>=6.0",
  "crawlee[beautifulsoup]>=0.6",
  "crawlee[playwright]>=0.6",
  "sqlalchemy",
  "pydantic",
  "aiosqlite",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "markdown>=3.5",
  "typer>=0.15,<1",
  "requests>=2.32.5"
]

[project.scripts]
compsynth = "comp_synth.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/comp_synth"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["scripts"]
markers = [
  "allow_llm: permit a test to access the configured real LLM provider",
  "slow: slow integration tests that are not part of the normal unit feedback loop"
]
